# Publishes a release whenever a version tag (v12.4, v12.5, ...) is pushed:
# builds HRM Viewer.exe, makes the update and full zips, and attaches them with the changelog as notes.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache-dependency-path: desktop/go.sum

      - name: Build HRM Viewer.exe
        working-directory: desktop
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-H windowsgui -s -w" -o "$RUNNER_TEMP/HRM Viewer.exe" .

      - name: Build the zips
        run: python3 tools/ci_build.py "$RUNNER_TEMP/HRM Viewer.exe" dist

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(cat dist/version.txt)" = "${GITHUB_REF_NAME}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat dist/version.txt)
          TITLE="HRM Viewer $V — $(python3 -c "import json;v='$V';print(next(e['title'] for e in json.load(open('static/changelog.json')) if e['version']==v))")"
          gh release create "v$V" dist/HRM-Viewer-update-$V.zip dist/HRM-Viewer-$V-full.zip \
            --title "$TITLE" --notes-file dist/notes.md --latest
