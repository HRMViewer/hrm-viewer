# Publishes a release whenever a new version reaches main: when VERSION in app.py has no release yet,
# builds HRM Viewer.exe and the Windows zips, the Mac app and the Linux download (each tried on a real machine
# first, see desktop-builds.yml), and attaches them all with the changelog as notes.
# The viewers out there see it within a few hours and offer to install it.
# If GitHub can't supply a Mac machine, the mac-linux job ends "abandoned" and nothing is published: re-run the
# failed jobs, or push again; the version is still unreleased, so the next run builds and publishes it.
name: Release

on:
  push:
    branches: [main]
    paths: ["app.py", "static/**", "desktop/**", "tools/**", ".github/workflows/*.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PY_VERSION: "3.13.12"   # the Python that ships inside the Windows download

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v5
      - name: Is this version already released?
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 -c "import re;print(re.search(r'^VERSION = \"([^\"]+)\"', open('app.py').read(), re.M).group(1))")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # yes: a new release · add: it's out but a download is missing (it gets built and added) · no: nothing to do
          if ! gh release view "v$V" >/dev/null 2>&1; then echo "new=yes" >> "$GITHUB_OUTPUT"
          else
            have=$(gh release view "v$V" --json assets --jq '.assets[].name')
            echo "v$V is out with: $have"
            if echo "$have" | grep -q -- "-mac.zip$" && echo "$have" | grep -q -- "-linux.tar.gz$"; then echo "new=no" >> "$GITHUB_OUTPUT"; else echo "new=add" >> "$GITHUB_OUTPUT"; fi
          fi

  mac-linux:
    needs: check
    if: needs.check.outputs.new != 'no'
    uses: ./.github/workflows/desktop-builds.yml
    with:
      mac: true

  release:
    needs: [check, mac-linux]
    if: needs.check.outputs.new != 'no'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.7"
          cache-dependency-path: desktop/go.sum

      - name: Build HRM Viewer.exe
        working-directory: desktop
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-H windowsgui -s -w" -o "$RUNNER_TEMP/HRM Viewer.exe" .

      - name: Get the Windows embeddable Python
        run: |
          curl -fsSL -o "$RUNNER_TEMP/py.zip" "https://www.python.org/ftp/python/${PY_VERSION}/python-${PY_VERSION}-embed-amd64.zip"
          mkdir -p "$RUNNER_TEMP/python" && unzip -q "$RUNNER_TEMP/py.zip" -d "$RUNNER_TEMP/python"
          ls "$RUNNER_TEMP/python"

      - name: Get the Mac and Linux downloads
        uses: actions/download-artifact@v7
        with:
          pattern: "*-package"
          path: dist
          merge-multiple: true

      - name: Build the Windows zips and the notes
        run: python3 tools/ci_build.py "$RUNNER_TEMP/HRM Viewer.exe" dist "$RUNNER_TEMP/python"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.check.outputs.version }}
        run: |
          ls -la dist
          TITLE="HRM Viewer $V — $(python3 -c "import json,os;v=os.environ['V'];print(next(e['title'] for e in json.load(open('static/changelog.json')) if e['version']==v))")"
          # every download must be there: Windows (update + full), Mac and Linux
          for f in "dist/HRM-Viewer-update-$V.zip" "dist/HRM-Viewer-$V-full.zip" "dist/HRM-Viewer-$V-mac.zip" "dist/HRM-Viewer-$V-linux.tar.gz"; do
            [ -f "$f" ] || { echo "missing $f: not publishing"; exit 1; }
          done
          if [ "${{ needs.check.outputs.new }}" = "add" ]; then
            # already out without some downloads: add them (and the notes that list them)
            gh release upload "v$V" "dist/HRM-Viewer-$V-mac.zip" "dist/HRM-Viewer-$V-linux.tar.gz" --clobber
            gh release edit "v$V" --notes-file dist/notes.md
          else
            gh release create "v$V" "dist/HRM-Viewer-update-$V.zip" "dist/HRM-Viewer-$V-full.zip" "dist/HRM-Viewer-$V-mac.zip" "dist/HRM-Viewer-$V-linux.tar.gz" \
              --target "$GITHUB_SHA" --title "$TITLE" --notes-file dist/notes.md --latest
          fi

      - name: Keep a log of this release run
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/rl" && cd "$RUNNER_TEMP/rl"
          { echo "version ${{ needs.check.outputs.version }} mode ${{ needs.check.outputs.new }} at $(date -u)"; echo '${{ toJSON(needs) }}'; ls -la "$GITHUB_WORKSPACE/dist" 2>&1; echo "job: ${{ job.status }}"; } > log.txt
          git init -q && git checkout -q -b ci-release-log && git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "release log"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-release-log

  # always: how each part went (Mac and Linux builds, publishing), so a failed or partial release can be looked into
  report:
    needs: [check, mac-linux, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Keep a summary of this release run
        run: |
          mkdir -p "$RUNNER_TEMP/rs" && cd "$RUNNER_TEMP/rs"
          echo '${{ toJSON(needs) }}' > needs.json
          echo "version ${{ needs.check.outputs.version }} mode ${{ needs.check.outputs.new }} at $(date -u)" > summary.txt
          git init -q && git checkout -q -b ci-release-summary && git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "release summary"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-release-summary
