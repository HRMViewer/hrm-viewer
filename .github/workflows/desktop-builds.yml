# Builds the Mac and Linux downloads and tries each one on a real machine (opens the app, checks the viewer
# answers from its own window, quits, checks it stopped). Used by the release workflow; can also be run by hand
# or by pushing to the desktop-test branch, which publishes nothing.
name: Mac and Linux builds

on:
  workflow_call:
    inputs:
      mac:
        description: "Build the Mac app too"
        type: boolean
        default: true
  workflow_dispatch:
  push:
    branches: [desktop-test]

permissions:
  contents: write

# a newer test push replaces a test build still running (release builds are never cancelled)
concurrency:
  group: desktop-builds-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/desktop-test' }}

env:
  GO_VERSION: "1.24.7"
  PBS_TAG: "20251202"      # python-build-standalone release with the portable Python that ships inside
  PBS_PY: "3.13.10"

jobs:
  linux:
    timeout-minutes: 30
    # built on the oldest supported Ubuntu so it runs on as many Linux versions as possible
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: desktop/go.sum

      - name: WebKitGTK 4.1 and 4.0 (for the window) and test tools
        run: |
          exec > >(tee -a "$RUNNER_TEMP/log.txt") 2>&1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libwebkit2gtk-4.0-dev xvfb imagemagick

      - name: Build the launcher and the window app
        working-directory: desktop
        run: |
          exec > >(tee -a "$RUNNER_TEMP/log.txt") 2>&1
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/HRM Viewer" .
          PKG_CONFIG="$PWD/pkg-config-webkit41.sh" CGO_ENABLED=1 go build -tags webview -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/hrm-viewer-window" .
          # the same window app for systems with WebKitGTK 4.0 instead of 4.1 (the launcher tries 4.1 first)
          CGO_ENABLED=1 go build -tags webview -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/hrm-viewer-window-4.0" .
          ldd "$RUNNER_TEMP/hrm-viewer-window" | grep webkit2gtk; ldd "$RUNNER_TEMP/hrm-viewer-window-4.0" | grep webkit2gtk

      - name: Get the portable Python
        run: |
          exec > >(tee -a "$RUNNER_TEMP/log.txt") 2>&1
          curl -fsSL -o "$RUNNER_TEMP/py.tgz" "https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_TAG}/cpython-${PBS_PY}%2B${PBS_TAG}-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
          mkdir -p "$RUNNER_TEMP/py" && tar xzf "$RUNNER_TEMP/py.tgz" -C "$RUNNER_TEMP/py"

      - name: Make the download
        run: |
          exec > >(tee -a "$RUNNER_TEMP/log.txt") 2>&1
          python3 tools/ci_unix.py linux dist "$RUNNER_TEMP/HRM Viewer" "$RUNNER_TEMP/hrm-viewer-window" "$RUNNER_TEMP/py/python" "$RUNNER_TEMP/hrm-viewer-window-4.0"

      - name: Try it
        timeout-minutes: 8
        run: |
          exec > >(tee -a "$RUNNER_TEMP/log.txt") 2>&1
          bash tools/smoke_linux.sh "$PWD/dist"


      - name: Share the results (test builds only)
        if: always() && github.ref == 'refs/heads/desktop-test'
        run: |
          mkdir -p "$RUNNER_TEMP/res"
          cp "$RUNNER_TEMP/log.txt" "$RUNNER_TEMP/res/" 2>/dev/null || true
          cp dist/*.png "$RUNNER_TEMP/res/" 2>/dev/null || true
          cp "$HOME/Library/Application Support/HRM Viewer/data/desktop.log" "$RUNNER_TEMP/res/desktop.log" 2>/dev/null || true
          cp "$RUNNER_TEMP/xprotect.txt" "$RUNNER_TEMP/res/" 2>/dev/null || true
          ls -la dist > "$RUNNER_TEMP/res/dist.txt" 2>&1 || true
          echo "${{ job.status }}" > "$RUNNER_TEMP/res/status.txt"
          cd "$RUNNER_TEMP/res" && git init -q && git checkout -q -b ci-results-linux && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "linux results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results-linux

      - uses: actions/upload-artifact@v6
        with:
          name: linux-package
          path: |
            dist/*.tar.gz
            dist/linux-screenshot.png
          if-no-files-found: error

  mac:
    # left out of a release with mac: false (test pushes and manual runs always build it)
    # (written this way because GitHub treats an empty input as equal to false: test pushes have no inputs)
    if: ${{ format('{0}', inputs.mac) != 'false' }}
    timeout-minutes: 40
    runs-on: macos-15   # Apple Silicon, macOS 15 (macos-14 and macos-13 machines are no longer handed out)
    steps:
      - name: Say the Mac build has started (test builds only)
        if: github.ref == 'refs/heads/desktop-test'
        run: |
          mkdir -p "$RUNNER_TEMP/started" && cd "$RUNNER_TEMP/started" && echo "running on $(sw_vers -productVersion) $(uname -m) since $(date -u)" > status.txt
          git init -q && git checkout -q -b ci-results-mac && git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "mac started"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results-mac

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: desktop/go.sum

      - name: Build the app for Apple Silicon and Intel Macs
        working-directory: desktop
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CGO_ENABLED: "1"
        run: |
          exec > >(tee -a "$RUNNER_TEMP/log.txt") 2>&1
          GOARCH=arm64 go build -tags webview -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/hv-arm64" .
          GOARCH=amd64 CC="clang -arch x86_64" CXX="clang++ -arch x86_64" go build -tags webview -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/hv-amd64" .
          lipo -create -output "$RUNNER_TEMP/HRM Viewer" "$RUNNER_TEMP/hv-arm64" "$RUNNER_TEMP/hv-amd64"
          lipo -info "$RUNNER_TEMP/HRM Viewer"

      - name: Get the portable Pythons
        run: |
          exec > >(tee -a "$RUNNER_TEMP/log.txt") 2>&1
          for arch in aarch64 x86_64; do
            curl -fsSL -o "$RUNNER_TEMP/py-$arch.tgz" "https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_TAG}/cpython-${PBS_PY}%2B${PBS_TAG}-${arch}-apple-darwin-install_only_stripped.tar.gz"
            mkdir -p "$RUNNER_TEMP/py-$arch" && tar xzf "$RUNNER_TEMP/py-$arch.tgz" -C "$RUNNER_TEMP/py-$arch"
          done

      - name: Make the app
        run: |
          exec > >(tee -a "$RUNNER_TEMP/log.txt") 2>&1
          python3 tools/ci_unix.py mac dist "$RUNNER_TEMP/HRM Viewer" "$RUNNER_TEMP/py-aarch64/python" "$RUNNER_TEMP/py-x86_64/python"

      - name: Sign it (ad hoc, free) and zip it
        run: |
          exec > >(tee -a "$RUNNER_TEMP/log.txt") 2>&1
          # sign every program file inside first (the Pythons' libraries and the Intel Python aren't signed when they
          # arrive), then the app around them: free "ad hoc" signatures, which Macs need to run code
          find "dist/HRM Viewer.app/Contents/Resources" -type f \( -name "*.so" -o -name "*.dylib" -o -perm -u+x \) -print0 \
            | while IFS= read -r -d '' f; do if file -b "$f" | grep -q "Mach-O"; then codesign --force --sign - "$f"; fi; done
          echo "signed $(find "dist/HRM Viewer.app/Contents/Resources" -type f \( -name "*.so" -o -name "*.dylib" \) | wc -l) libraries"
          codesign --force --sign - "dist/HRM Viewer.app"
          codesign --verify --deep --verbose=2 "dist/HRM Viewer.app"
          V=$(cat dist/version.txt)
          ditto -c -k --sequesterRsrc --keepParent "dist/HRM Viewer.app" "dist/HRM-Viewer-$V-mac.zip"
          ls -la dist

      - name: What macOS makes of it after a download
        run: |
          exec > >(tee -a "$RUNNER_TEMP/log.txt") 2>&1
          # unzip a copy and mark it as downloaded by a browser, as a real download would be
          mkdir -p "$RUNNER_TEMP/dl" && ditto -x -k dist/HRM-Viewer-*-mac.zip "$RUNNER_TEMP/dl"
          xattr -w -r com.apple.quarantine "0083;$(printf %x $(date +%s));Safari;" "$RUNNER_TEMP/dl/HRM Viewer.app"
          # expected: "rejected" (not notarized: the person clicks Open Anyway once). "damaged" would mean it can't be opened at all.
          spctl --assess --type execute -vvv "$RUNNER_TEMP/dl/HRM Viewer.app" 2>&1 | tee "$RUNNER_TEMP/gk.txt" || true
          if grep -qi "damaged\|invalid signature\|code has no resources" "$RUNNER_TEMP/gk.txt"; then echo "macOS would call it damaged"; exit 1; fi
          syspolicy_check distribution "$RUNNER_TEMP/dl/HRM Viewer.app" 2>&1 | head -40 || true
          # what XProtect itself said while checking (which file, and whether it was a finding or a scan problem)
          log show --last 3m --style compact --predicate 'process CONTAINS[c] "xprotect" OR subsystem CONTAINS[c] "xprotect" OR process == "syspolicyd"' 2>/dev/null \
            | grep -i -E "xprotect|scan|malware|HRM Viewer|python|error|fail" | grep -v -i "trace\b" | tail -60 > "$RUNNER_TEMP/xprotect.txt" || true
          wc -l "$RUNNER_TEMP/xprotect.txt"; tail -60 "$RUNNER_TEMP/xprotect.txt"
          # the same check on the app without its Pythons, to see whether they are what XProtect trips on
          cp -R "$RUNNER_TEMP/dl/HRM Viewer.app" "$RUNNER_TEMP/nopy.app" && rm -rf "$RUNNER_TEMP/nopy.app/Contents/Resources/python-"*
          codesign --force --deep --sign - "$RUNNER_TEMP/nopy.app" && xattr -w -r com.apple.quarantine "0083;$(printf %x $(date +%s));Safari;" "$RUNNER_TEMP/nopy.app"
          echo "--- without the Pythons:"; syspolicy_check distribution "$RUNNER_TEMP/nopy.app" 2>&1 | grep -E "Error$|Ticket|Xprotect|passed|failed" || true
          # and a plain "hello" app built here and signed the same way: if it gets the same message, it's just how this check
          # treats any app that isn't notarised
          mkdir -p "$RUNNER_TEMP/Hello.app/Contents/MacOS" && printf 'int main(){return 0;}' > "$RUNNER_TEMP/h.c"
          clang -o "$RUNNER_TEMP/Hello.app/Contents/MacOS/Hello" "$RUNNER_TEMP/h.c"
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string Hello" -c "Add :CFBundleIdentifier string test.hello" -c "Add :CFBundlePackageType string APPL" "$RUNNER_TEMP/Hello.app/Contents/Info.plist"
          codesign --force --sign - "$RUNNER_TEMP/Hello.app" && xattr -w -r com.apple.quarantine "0083;$(printf %x $(date +%s));Safari;" "$RUNNER_TEMP/Hello.app"
          echo "--- a plain hello app:"; syspolicy_check distribution "$RUNNER_TEMP/Hello.app" 2>&1 | grep -E "Error$|Ticket|Xprotect|passed|failed" || true
          codesign --verify --deep --strict --verbose=2 "dist/HRM Viewer.app" 2>&1 | tail -3 || true

      - name: Try it
        timeout-minutes: 8
        run: |
          exec > >(tee -a "$RUNNER_TEMP/log.txt") 2>&1
          # 14.9: a release with the Mac changes, to try an in-app update (going back) on the Mac
          bash tools/smoke_mac.sh "$PWD/dist/HRM Viewer.app" "$PWD/dist" 14.9


      - name: Share the results (test builds only)
        if: always() && github.ref == 'refs/heads/desktop-test'
        run: |
          mkdir -p "$RUNNER_TEMP/res"
          cp "$RUNNER_TEMP/log.txt" "$RUNNER_TEMP/res/" 2>/dev/null || true
          cp dist/*.png "$RUNNER_TEMP/res/" 2>/dev/null || true
          cp "$HOME/Library/Application Support/HRM Viewer/data/desktop.log" "$RUNNER_TEMP/res/desktop.log" 2>/dev/null || true
          cp "$RUNNER_TEMP/xprotect.txt" "$RUNNER_TEMP/res/" 2>/dev/null || true
          ls -la dist > "$RUNNER_TEMP/res/dist.txt" 2>&1 || true
          echo "${{ job.status }}" > "$RUNNER_TEMP/res/status.txt"
          cd "$RUNNER_TEMP/res" && git init -q && git checkout -q -b ci-results-mac && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "mac results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results-mac

      - uses: actions/upload-artifact@v6
        with:
          name: mac-package
          path: |
            dist/*-mac.zip
            dist/mac-screenshot.png
          if-no-files-found: error

  # the same app tried on an Intel Mac (the app holds both; this runs its Intel half and the Intel Python)
  mac-intel:
    needs: mac
    timeout-minutes: 25
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: mac-package
          path: dist

      - name: Try it on Intel
        timeout-minutes: 10
        run: |
          exec > >(tee -a "$RUNNER_TEMP/log.txt") 2>&1
          ditto -x -k dist/HRM-Viewer-*-mac.zip dist
          codesign --verify --deep --verbose=2 "dist/HRM Viewer.app"
          bash tools/smoke_mac.sh "$PWD/dist/HRM Viewer.app" "$PWD/dist"

      - name: Share the results (test builds only)
        if: always() && github.ref == 'refs/heads/desktop-test'
        run: |
          mkdir -p "$RUNNER_TEMP/res"
          cp "$RUNNER_TEMP/log.txt" "$RUNNER_TEMP/res/" 2>/dev/null || true
          cp dist/mac-screenshot.png "$RUNNER_TEMP/res/" 2>/dev/null || true
          cp "$HOME/Library/Application Support/HRM Viewer/data/desktop.log" "$RUNNER_TEMP/res/desktop.log" 2>/dev/null || true
          echo "${{ job.status }}" > "$RUNNER_TEMP/res/status.txt"
          cd "$RUNNER_TEMP/res" && git init -q && git checkout -q -b ci-results-mac-intel && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "mac intel results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results-mac-intel
